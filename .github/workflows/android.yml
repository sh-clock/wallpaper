name: android-ci

on:
  push:
    branches: [main]
    tags: ['v*']     # manual PAT tags rebuild + release on demand
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # the bump job commits version.properties + pushes the
                    # version tag; the build publishes APKs as RELEASE
                    # ASSETS (free, unlike workflow artifacts)

# serialize same-ref pushes — two pushes inside ~2 min both bump at their
# own SHA and collide on the same v1.7.x tag (the second's git push fails
# -> its build runs (if: always()) but releases NOTHING). The queue
# re-checks out main after the first bump landed and bumps the NEXT
# minor. cancel-in-progress FALSE on purpose.
concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---- asset-change version bump (aim 7) ------------------------------------
  # Every push to main that adds/modifies app/src/main/assets/** (a new
  # scene GLB + its camdat.json models[] entry) OR the engine/code bumps
  # the minor version ONE step (1.7.40 -> 1.7.41, versionCode 10740 ->
  # 10741) in version.properties, commits with [skip ci], and pushes BOTH
  # the commit and the tag to main. NOTE: a GITHUB_TOKEN push cannot
  # re-trigger workflows (anti-recursion rule), so the build job below
  # runs AFTER the bump (needs:) with ref: main and publishes the release
  # itself. Pushes without releasable changes do not bump.
  bump:
    # push events fire for TAG pushes too — the bump must run ONLY on
    # branch-main pushes (a PAT tag push used to run the bump on the
    # tag's tree and push a stray commit to main).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      did: ${{ steps.bump.outputs.did }}
      version: ${{ steps.bump.outputs.version }}
    steps:
      - name: Checkout (full history for the diff)
        uses: actions/checkout@v4
        with:
          # depth-2 saw only the TIP commit — asset changes in earlier
          # commits of a multi-commit push missed the bump. Fetch the
          # push's BEFORE base explicitly below.
          fetch-depth: 0

      - name: Detect asset changes and bump the version
        id: bump
        run: |
          set -e
          # the push's base: github.event.before is the previous main tip
          # (0000… only for the very first push of a branch — fall back to
          # HEAD^ then)
          BEFORE='${{ github.event.before }}'
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            BEFORE=$(git rev-parse HEAD^)
          else
            git fetch --depth=1 origin "$BEFORE" || BEFORE=$(git rev-parse HEAD^)
          fi
          # the releasable set: the scene corpus (GLBs + camdat.json — a
          # new scene = an asset drop), the engine/native code, the Java
          # shell, the resources, the manifest and the gradle wiring
          # (res-only + gradle-only changes must release too).
          CHANGED=$(git diff --name-only "$BEFORE" HEAD -- \
            app/src/main/assets/ app/src/main/cpp/ app/src/main/java/ \
            app/src/main/res/ app/src/main/AndroidManifest.xml \
            app/build.gradle build.gradle settings.gradle \
            gradle.properties gradle/ version.properties || true)
          if [ -z "$CHANGED" ]; then
            echo "no asset changes - no bump"
            echo "did=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "assets changed:"
          echo "$CHANGED"
          NAME=$(grep '^versionName=' version.properties | cut -d= -f2)
          MAJ=$(echo "$NAME" | cut -d. -f1)
          MIN=$(echo "$NAME" | cut -d. -f2)
          PAT=$(echo "$NAME" | cut -d. -f3)
          NEWPAT=$((PAT + 1))
          NEWNAME="$MAJ.$MIN.$NEWPAT"
          NEWCODE=$(( $(grep '^versionCode=' version.properties | cut -d= -f2) + 1 ))
          printf 'versionName=%s\nversionCode=%s\n' "$NEWNAME" "$NEWCODE" > version.properties
          git config user.name  "sh1-release-bot"
          git config user.email "sh1-release-bot@users.noreply.github.com"
          git add version.properties
          git commit -m "bump version to $NEWNAME (asset change) [skip ci]"
          git tag "v$NEWNAME"
          git push origin main "v$NEWNAME"
          echo "did=1" >> "$GITHUB_OUTPUT"
          echo "version=$NEWNAME" >> "$GITHUB_OUTPUT"
          echo "new version: $NEWNAME"

  # ---- build + smoke + release ------------------------------------------------
  # Runs after the bump (checkout of main sees the bumped version). On
  # manual v* tag pushes (a human PAT tag) the workflow triggers directly
  # and the release publishes under the tag.
  build:
    needs: bump
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (main carries the bump commit; tags use the tag)
        uses: actions/checkout@v4
        with:
          # PR builds check out the PR head SHA; tags build the tag;
          # pushes build the pushed ref.
          ref: ${{ github.event.pull_request.head.sha || (startsWith(github.ref, 'refs/tags/') && github.ref || github.ref) }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Android SDK + NDK 27.2 + CMake 3.22.1 are preinstalled on
      # ubuntu-latest runners; AGP resolves/downloads any missing piece
      # via the SDK manager (licenses pre-accepted on the images).
      # The arm64-v8a-only ABI set comes from app/build.gradle's
      # ndk.abiFilters (the SH1 software rasterizer builds one .so).

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Build release APK (signed with the committed sh1.keystore)
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Smoke test — verify the APKs exist, are zips and contain the native lib + the scene corpus
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          test -s app/build/outputs/apk/release/app-release.apk
          file app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/release/app-release.apk
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -E 'libsh1\.so|AndroidManifest' | head
          # the corpus rides in the APK: every GLB + camdat.json
          GLBS=$(unzip -l app/build/outputs/apk/release/app-release.apk | grep -c 'assets/sh1/.*\.glb')
          echo "release APK scene GLBs: $GLBS"
          test "$GLBS" -ge 44
          unzip -l app/build/outputs/apk/release/app-release.apk | grep 'assets/sh1/camdat.json'

      - name: Read the app version (release naming + verification)
        id: ver
        run: |
          NAME=$(grep '^versionName=' version.properties | cut -d= -f2 || echo "0.0.0")
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "version.properties says: $NAME"

      # Release when the bump job bumped (an asset change: publish under
      # the pushed version tag) or on a manual v* tag push. BOTH APKs
      # (the release APK signed with sh1.keystore + the debug APK) ride
      # as RELEASE ASSETS (free; workflow artifacts stay at zero).
      - name: Upload release assets (after an asset bump, or a v* tag)
        if: needs.bump.outputs.did == '1' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          # a manual PAT TAG push releases under THE PUSHED TAG (never
          # v<version.properties>, which would overwrite the existing
          # versioned release's APKs with the tag-tree binaries); a
          # bump-driven push still releases under the freshly-bumped
          # version tag.
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', steps.ver.outputs.name) }}
          generate_release_notes: true
          files: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release.apk
