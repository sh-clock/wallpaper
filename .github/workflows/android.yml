name: android-ci

on:
  push:
    branches: [main]
    tags: ['v*']     # manual PAT tags rebuild + release on demand
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # the bump job commits version.properties + pushes the
                    # version tag; the build publishes APKs as RELEASE
                    # ASSETS (free, unlike workflow artifacts)

# serialize same-ref pushes (the old-repo rationale): two pushes inside
# ~2 min both bump at their own SHA and would collide on the same tag.
concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---- version bump (aim 7, THE 1.0.0 SCHEME) --------------------------------
  # Every push to main that adds/modifies app/src/main/assets/** (a new
  # scene GLB + its camdat.json models[] entry) bumps the version ONE PATCH
  # level (1.0.0 -> 1.0.1 -> 1.0.2 ...). A push that ALSO touches the
  # engine/native code, the Java shell, the resources, the manifest or the
  # gradle wiring bumps ONE MINOR level instead (1.0.0 -> 1.1.0).
  # versionCode +1 every bump. The bump commits with [skip ci] and pushes
  # BOTH the commit and the tag to main. ONE canonical linear series —
  # the old v1.7.x / v10.x / v11 tags are RETIRED with the reset. A
  # GITHUB_TOKEN push cannot re-trigger workflows (anti-recursion), so the
  # build job below runs AFTER the bump (needs:) with ref: main and
  # publishes the release itself. Pushes without releasable changes do
  # not bump.
  # V45 (audit H-6): the bump is GATED — it needs anim-gate + unit-tests
  # and runs only when BOTH passed, so a red gate burns no version number
  # and pushes no tag. Before V45 the bump ran in PARALLEL with the gates:
  # a red gate still bumped + tagged, then the build job's own gate
  # condition skipped the build — a pushed tag with no release (exactly
  # v1.10.0's state at the V45 audit, when the unit gate was red).
  bump:
    # OPERATIONAL NOTE (the S23 race lesson): a burst of merges can race
    # two bump runs off the same pre-merge version state — the loser's
    # `git push origin main "v$NEW"` fails at the tag (already exists) and
    # an orphaned tag can block the next bump (the S23 repair: delete the
    # orphaned tag + a consolidated manual bump + a NON-[skip ci] tag
    # commit to re-trigger the release via the tags: ['v*'] path).
    # GATED on the two test gates (V45 H-6): the same result-condition
    # shape the build job below uses — the bump + tag push happens ONLY
    # after both gates pass. (The 'skipped' allowances mirror build's;
    # on a push to main the gates always run.)
    needs: [anim-gate, unit-tests]
    if: always() && (needs.anim-gate.result == 'success' || needs.anim-gate.result == 'skipped') && (needs.unit-tests.result == 'success' || needs.unit-tests.result == 'skipped') && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      did: ${{ steps.bump.outputs.did }}
      version: ${{ steps.bump.outputs.version }}
    steps:
      - name: Checkout (full history for the diff)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changes and bump the version (asset=PATCH, code=MINOR)
        id: bump
        run: |
          set -e
          BEFORE='${{ github.event.before }}'
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            BEFORE=$(git rev-parse HEAD^)
          else
            git fetch --depth=1 origin "$BEFORE" || BEFORE=$(git rev-parse HEAD^)
          fi
          # the releasable set — split by bump class:
          #   ASSET set  = the scene corpus (GLBs + camdat.json)  -> PATCH
          #   CODE set   = engine/native/shell/res/gradle wiring -> MINOR
          ASSET=$(git diff --name-only "$BEFORE" HEAD -- \
            app/src/main/assets/ || true)
          CODE=$(git diff --name-only "$BEFORE" HEAD -- \
            app/src/main/cpp/ app/src/main/java/ \
            app/src/main/res/ app/src/main/AndroidManifest.xml \
            app/build.gradle build.gradle settings.gradle \
            app/proguard-rules.pro gradle.properties gradle/ \
            .github/workflows/ || true)
          if [ -z "$ASSET" ] && [ -z "$CODE" ]; then
            echo "no asset changes - no bump"
            echo "did=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "assets changed:"
          echo "$ASSET"
          echo "code changed:"
          echo "$CODE"
          NAME=$(grep '^versionName=' version.properties | cut -d= -f2)
          MAJ=$(echo "$NAME" | cut -d. -f1)
          MIN=$(echo "$NAME" | cut -d. -f2)
          PAT=$(echo "$NAME" | cut -d. -f3)
          PAT=${PAT:-0}
          if [ -n "$CODE" ]; then
            # code/engine change -> ONE MINOR level (1.0.0 -> 1.1.0)
            NEWMIN=$((MIN + 1))
            NEWNAME="$MAJ.$NEWMIN.0"
            KIND="minor"
          else
            # asset-only change -> ONE PATCH level (1.0.0 -> 1.0.1)
            NEWPAT=$((PAT + 1))
            NEWNAME="$MAJ.$MIN.$NEWPAT"
            KIND="patch"
          fi
          NEWCODE=$(( $(grep '^versionCode=' version.properties | cut -d= -f2) + 1 ))
          printf 'versionName=%s\nversionCode=%s\n' "$NEWNAME" "$NEWCODE" > version.properties
          git config user.name  "sh1-release-bot"
          git config user.email "sh1-release-bot@users.noreply.github.com"
          git add version.properties
          git commit -m "bump version to $NEWNAME ($KIND change) [skip ci]"
          git tag "v$NEWNAME"
          git push origin main "v$NEWNAME"
          echo "did=1" >> "$GITHUB_OUTPUT"
          echo "version=$NEWNAME" >> "$GITHUB_OUTPUT"
          echo "new version: $NEWNAME ($KIND)"

  # ---- the ALL-ANIMATIONS GATE (S20-cont) ------------------------------------
  # The PoC S20 all-animations suite ported to the twin binary + the APK's
  # OWN scene corpus: 25 driver families, anim-targeted cameras, A/B +
  # sequence pixel proofs (FOGPOC_NORING kills the ring for the clean A/B).
  # Runs on every push + PR BEFORE the release ships - the "test ALL work
  # prior to shipping" contract for the wallpaper engine.
  anim-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build the host verification engine (the twin, software path)
        run: ./bench/build_host_engine.sh

      - name: Install Pillow (the suite's pixel-diff dependency)
        run: pip install --user pillow

      - name: The all-animations suite - 25/25 families must animate
        run: python3 bench/anim_suite.py

  # ---- the unit-test gate (S20-cont: the V42 E-1 review found the CI
  # ran NO unit tests at all — assemble + smoke + anim-gate only). The
  # Robolectric suite includes the asset-refresh upgrade path.
  # V44: the gradle dep cache (setup-java cache:gradle — the robolectric
  # + nativeruntime jars) AND the ~/.m2 cache (Robolectric's RUNTIME
  # android-all-instrumented jars, fetched by Robolectric's own maven
  # resolver at test time, NOT a gradle dependency) — the 2026-11-22
  # maven-central 429 mass rate-limit made every fresh runner fail at
  # MavenArtifactFetcher.fetch; with both caches only the FIRST run
  # after a version bump downloads, everything later is cache-served.
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17 (with the gradle dependency cache)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Cache the Robolectric runtime jars (maven 429 immunity)
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-m2-v1-${{ hashFiles('gradle/libs.versions.toml', 'app/build.gradle') }}
          restore-keys: |
            robolectric-m2-v1-

      - name: The Robolectric unit-test suite
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

  # ---- build + smoke + release ---------------------------------------------
  build:
    needs: [bump, anim-gate, unit-tests]
    if: always() && (needs.anim-gate.result == 'success' || needs.anim-gate.result == 'skipped') && (needs.unit-tests.result == 'success' || needs.unit-tests.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (main carries the bump commit; tags use the tag)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || (startsWith(github.ref, 'refs/tags/') && github.ref || github.ref) }}

      - name: Set up JDK 17 (with the gradle dependency cache)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle   # V44: maven-central 429 immunity for the AGP/gradle deps too

      # Android SDK + NDK 27.2 + CMake 3.22.1 are preinstalled on
      # ubuntu-latest runners; AGP resolves/downloads any missing piece
      # via the SDK manager (licenses pre-accepted on the images).

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Build release APK (signed with the GitHub-secrets key; falls
               back to the committed shared test keystore when the secrets
               are unset — see README 'Release signing')
        env:
          WALLPAPER_KEYSTORE_BASE64:   ${{ secrets.WALLPAPER_KEYSTORE_BASE64 }}
          WALLPAPER_KEYSTORE_PASSWORD: ${{ secrets.WALLPAPER_KEYSTORE_PASSWORD }}
          WALLPAPER_KEY_ALIAS:         ${{ secrets.WALLPAPER_KEY_ALIAS }}
          WALLPAPER_KEY_PASSWORD:      ${{ secrets.WALLPAPER_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Smoke test — verify the APKs exist, are zips and contain the native lib + the scene corpus
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          test -s app/build/outputs/apk/release/app-release.apk
          file app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/release/app-release.apk
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -E 'libsh1\.so|AndroidManifest' | head
          # the corpus rides in the APK: every GLB + camdat.json
          GLBS=$(unzip -l app/build/outputs/apk/release/app-release.apk | grep -c 'assets/sh1/.*\.glb')
          echo "release APK scene GLBs: $GLBS"
          test "$GLBS" -ge 45
          unzip -l app/build/outputs/apk/release/app-release.apk | grep 'assets/sh1/camdat.json'

      - name: Read the app version (release naming + verification)
        id: ver
        run: |
          NAME=$(grep '^versionName=' version.properties | cut -d= -f2 || echo "0.0")
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "version.properties says: $NAME"

      # Release when the bump job bumped (an asset change: publish under
      # the pushed version tag) or on a manual v* tag push. BOTH APKs
      # (the release APK signed with sh1.keystore + the debug APK) ride
      # as RELEASE ASSETS (free; workflow artifacts stay at zero).
      - name: Upload release assets (after an asset bump, or a v* tag)
        if: needs.bump.outputs.did == '1' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', steps.ver.outputs.name) }}
          generate_release_notes: true
          files: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release.apk
