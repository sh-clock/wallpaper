name: android-ci

on:
  push:
    branches: [main]
    tags: ['v*']     # version tags pushed by the bump job + manual tags
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # the bump job commits version.properties; the release job
                    # publishes APKs as RELEASE ASSETS (free, unlike artifacts)

jobs:
  # ---- v7 (task 7): asset-change version bump --------------------------------
  # Every push that adds/modifies app/src/main/assets/** bumps the minor
  # version (1.7.30 -> 1.7.31) in version.properties, commits (with
  # [skip ci] so the commit itself does not re-trigger), and pushes the
  # matching tag -> the build job below runs and the APKs publish as a
  # GitHub Release of the SAME version. Pushes without asset changes do
  # NOT bump (the loop check below finds nothing and the job no-ops).
  bump:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for the diff)
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect asset changes and bump the minor version
        id: bump
        run: |
          set -e
          CHANGED=$(git diff --name-only HEAD^ HEAD -- app/src/main/assets/ || true)
          if [ -z "$CHANGED" ]; then
            echo "no asset changes - no bump"
            echo "did=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "assets changed:"
          echo "$CHANGED"
          NAME=$(grep '^versionName=' version.properties | cut -d= -f2)
          MAJ=$(echo "$NAME" | cut -d. -f1)
          MIN=$(echo "$NAME" | cut -d. -f2)
          PAT=$(echo "$NAME" | cut -d. -f3)
          NEWPAT=$((PAT + 1))
          NEWNAME="$MAJ.$MIN.$NEWPAT"
          NEWCODE=$(( $(grep '^versionCode=' version.properties | cut -d= -f2) + 1 ))
          printf 'versionName=%s\nversionCode=%s\n' "$NEWNAME" "$NEWCODE" > version.properties
          git config user.name  "sh1-release-bot"
          git config user.email "sh1-release-bot@users.noreply.github.com"
          git add version.properties
          git commit -m "bump version to $NEWNAME (asset change) [skip ci]"
          git tag "v$NEWNAME"
          # push BOTH the commit (so main carries the new version for the
          # next bump) and the tag (which triggers the build + release).
          # The commit message carries [skip ci] to avoid re-triggering.
          git push origin main "v$NEWNAME"
          echo "did=1" >> "$GITHUB_OUTPUT"
          echo "new version: $NEWNAME"

  # ---- build + smoke + release ----------------------------------------------
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Android SDK + NDK 27.2 + CMake 3.22.1 are preinstalled on
      # ubuntu-latest runners; gradle resolves them via the SDK locator.

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Build release APK (signed with the committed sh1.keystore)
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Smoke test — verify the APKs exist, are zips and contain the native lib
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          test -s app/build/outputs/apk/release/app-release.apk
          file app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/release/app-release.apk
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -E 'libsh1\.so|AndroidManifest' | head

      - name: Read the app version (release naming)
        id: ver
        run: |
          NAME=$(grep '^versionName=' version.properties | cut -d= -f2 || echo "0.0.0")
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Verify the version in the built APK matches version.properties
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          NAME=$(grep '^versionName=' version.properties | cut -d= -f2)
          BAD=$(aapt2 dump badging "$APK" 2>/dev/null || true)
          echo "$BAD" | grep -m1 "package:" || true
          echo "version.properties says: $NAME"

      # Releases publish on the version tags the bump job pushes (asset
      # changes) AND on manual v* tags. Release ASSETS are free (the
      # quota-safe design; artifacts stay at zero).
      - name: Upload release assets (version tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release.apk
