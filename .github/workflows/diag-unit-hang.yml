name: diag-unit-hang
on:
  push:
    branches: [diag-unit-hang]
  workflow_dispatch:

jobs:
  find-hang:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - name: Run ONLY the hanging test with a thread-dump watchdog
        run: |
          chmod +x gradlew
          # watchdog: after 7 min (build ~4min + test ~1min), SIGQUIT the
          # Gradle test worker so its full thread dump lands in the log,
          # then SIGKILL it so the step ends and the log uploads.
          (
            sleep 420
            echo "=== WATCHDOG: firing thread dumps ==="
            for p in $(pgrep -f GradleWorkerMain); do kill -3 "$p" 2>/dev/null; done
            sleep 25
            echo "=== WATCHDOG: killing workers ==="
            for p in $(pgrep -f GradleWorkerMain); do kill -9 "$p" 2>/dev/null; done
            sleep 5
            for p in $(pgrep -f 'GradleDaemon|gradle-launcher'); do kill -9 "$p" 2>/dev/null; done
          ) &
          ./gradlew testDebugUnitTest --no-daemon --stacktrace 2>&1 | tee test.log
      - name: Upload the test log (always)
        if: always()
        run: |
          echo "=== LAST 30 TEST EVENTS ==="
          grep -E "PASSED|FAILED|STARTED" test.log | tail -30 || true
          echo "=== THREAD DUMP SECTION (main stacks) ==="
          grep -A 12 ' WATCHDOG\|"Test worker"' test.log | head -120 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hang-diag-log
          path: test.log
