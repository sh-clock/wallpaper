plugins {
    alias libs.plugins.android.application
    alias libs.plugins.navigation.safeargs
}

android {
    namespace 'xyz.zedler.patrick.doodle'
    compileSdk 35
    ndkVersion '27.2.12479018'

    defaultConfig {
        // v10.7: fixed, clean package name (user mandate) — replaces the
        // v9.7 dynamic dot-segment scheme
        // (xyz.zedler.patrick.doodle.SH1.<rand>; historical suffixes: tR5n9m,
        // hk2lBg, l0qdfw, feqsiw, s1cr78, prmoxi, wcull, kybda8, sqegda,
        // busazz, v4nn8l, cz22s, b8r2oe, o9ympt, veH8pT, siime7).
        // applicationId is decoupled from the Java namespace
        // (xyz.zedler.patrick.doodle): the R class, manifest relative
        // component names and the JNI symbol names
        // (Java_xyz_zedler_patrick_doodle_*) all stay on the namespace,
        // so the rename has ZERO code/engine impact. A package-name change
        // installs as a NEW app — no in-place upgrade from any prior build
        // (re-pick the wallpaper once after installing).
        applicationId 'com.fog.sh.wallpaper'
        // minSdk 23 (Android 6): the SH1 build ships uncompressed, 16 KB-
        // aligned native libs (extractNativeLibs=false needs API 23+), and
        // the arm64-only build already excludes all pre-23 devices
        minSdk 23
        targetSdk 35
        // aim 7: the version lives in /version.properties — the CI's bump
        // job is the ONLY writer. THE 1.0.0 SCHEME (the user directive):
        //   asset-only change  -> PATCH  1.0.0 -> 1.0.1
        //   code/engine change -> MINOR  1.0.0 -> 1.1.0
        // versionCode +1 each. No more v10.x / v1.7.x / v11 series.
        def vprops = new Properties()
        file('../version.properties').withInputStream { vprops.load(it) }
        versionCode Integer.parseInt(vprops.getProperty('versionCode', '1'))
        versionName vprops.getProperty('versionName', '1.0.0')
        ndk {
            // SH1 engine: arm64 devices only (software rasterizer, one .so)
            abiFilters 'arm64-v8a'
        }
        externalNativeBuild {
            cmake {
                // 16 KB page-size compatibility (Android 15+)
                arguments '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON'
            }
        }
        resourceConfigurations += ['ar', 'bqi', 'cs', 'da', 'de', 'en', 'es', 'fi', 'fil', 'fr',
                                   'hu', 'in', 'it', 'iw', 'ja', 'ko', 'lt', 'nl', 'pl', 'pt-rBR',
                                   'ro', 'ru', 'tr', 'ug', 'uk', 'vi', 'zh-rCN']
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    applicationVariants.configureEach { variant ->
        variant.resValue "string", "versionName", variant.versionName
    }

    // v10.0: Robolectric needs the real resources (layouts, styles, attrs)
    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }

    // store native libs uncompressed so AGP can 16 KB-align them in the APK
    packaging {
        jniLibs {
            useLegacyPackaging = false
        }
    }

    signingConfigs {
        // THE RELEASE KEY — GitHub secrets first (the user's own key:
        // WALLPAPER_KEYSTORE_BASE64 + WALLPAPER_KEYSTORE_PASSWORD +
        // WALLPAPER_KEY_ALIAS + WALLPAPER_KEY_PASSWORD; see README
        // 'Release signing'). Falls back to the committed shared test
        // key sh1.keystore (test builds only), then the debug key.
        // AUDIT-B fix: ALL FOUR secrets required — a partial secret set
        // logs a warning and falls back; it can never select an
        // unpopulated config (the old 'any env var' test risked a
        // storeFile-less release config crashing AGP).
        release {
            def b64 = System.getenv('WALLPAPER_KEYSTORE_BASE64')
            def ksPass = System.getenv('WALLPAPER_KEYSTORE_PASSWORD')
            def kAlias = System.getenv('WALLPAPER_KEY_ALIAS')
            def kPass  = System.getenv('WALLPAPER_KEY_PASSWORD')
            def hasAll = b64 && ksPass && kAlias && kPass
            if (hasAll) {
                def ksFile = new File(buildDir, 'release.keystore')
                ksFile.bytes = Base64.getDecoder().decode(b64.replaceAll('\\s', ''))
                storeFile ksFile
                storePassword ksPass
                keyAlias kAlias
                keyPassword kPass
                println 'release signing: the GitHub-secrets key'
            } else {
                if (b64 || ksPass || kAlias || kPass) {
                    logger.warn('release signing: PARTIAL WALLPAPER_KEYSTORE_* secret set — falling back to the committed test key. Set ALL FOUR secrets.')
                }
                def ks = rootProject.file('sh1.keystore')
                if (ks.exists()) {
                    storeFile ks
                    storePassword 'sh1wall'
                    keyAlias 'sh1'
                    keyPassword 'sh1wall'
                    println 'release signing: the committed shared TEST key (set the four WALLPAPER_KEYSTORE_* secrets to sign with your own)'
                }
            }
        }
    }

    buildTypes {
        release {
            postprocessing {
                removeUnusedCode true
                removeUnusedResources true
                obfuscate false
                optimizeCode true
                proguardFiles {
                    getDefaultProguardFile('proguard-android-optimize.txt')
                    'proguard-rules.pro'
                }
            }
            debuggable false
            // the secrets-key if ALL FOUR secrets are set, the committed
            // test keystore if present, else debug-signed (AUDIT-B: the
            // selection condition == the population condition — a partial
            // secret set falls back cleanly instead of crashing).
            // NOTE: computed into a LOCAL first — a parenthesized
            // expression directly after `signingConfig` parses the
            // property assignment as a method call and the trailing
            // ternary assigns a BOOLEAN (the v1.1.0 CI build failure).
            def useReleaseKey = (System.getenv('WALLPAPER_KEYSTORE_BASE64') &&
                                 System.getenv('WALLPAPER_KEYSTORE_PASSWORD') &&
                                 System.getenv('WALLPAPER_KEY_ALIAS') &&
                                 System.getenv('WALLPAPER_KEY_PASSWORD')) ||
                                rootProject.file('sh1.keystore').exists()
            signingConfig useReleaseKey ? signingConfigs.release : signingConfigs.debug
        }
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    lint {
        abortOnError false
        disable 'MissingTranslation'
    }

    bundle {
        storeArchive {
            enable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_17
    }

    dependenciesInfo {
        includeInApk false
    }
}

dependencies {
    // v10.1 BUG 1: EXPLICIT pin. Previously androidx.activity resolved
    // TRANSITIVELY to 1.8.1 (via appcompat 1.7.0 / material) — a two-year-
    // old release of the library that OWNS the OnBackPressedDispatcher ->
    // window OnBackInvokedCallback bridge (the exact layer between the
    // system's predictive-back dispatch and the app on API 33+; the 1.9.x
    // series carries the bridge maturation: registration-state tracking,
    // in-progress callback handling, unregister-on-disable fixes).
    // 1.9.3 is the newest stable compatible with compileSdk 35 / AGP 8.7.
    implementation libs.activity
    implementation libs.appcompat
    implementation libs.fragment
    implementation libs.navigation.fragment
    implementation libs.navigation.ui
    implementation libs.preference
    implementation libs.material

    // v9.7: plain-JVM unit tests for the Camtrack data core (CamtrackDoc /
    // CamtrackJson / CamtrackMath are deliberately Android-free, so the
    // serialization round-trip proofs need no Robolectric — test-only)
    testImplementation 'junit:junit:4.13.2'
    // v10.0: Robolectric for the REAL widget/dispatcher/intent verification
    // (the Material Slider lazy draw-time validation crash mechanism, the
    // launcher trampoline flags, the resolution-aware dither policy with
    // real SharedPreferences) — real androidx/material bytecode on the
    // simulated framework, no device needed
    testImplementation 'org.robolectric:robolectric:4.14.1'
    testImplementation 'androidx.test:core:1.6.1'
}
