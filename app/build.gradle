plugins {
    id 'com.android.application'
}

android {
    namespace 'com.sh1.poc'
    compileSdk 34
    ndkVersion '27.2.12479018'

    defaultConfig {
        applicationId 'com.sh1.poc_SH1_dkk2p'
        minSdk 24
        targetSdk 34
        // v7 (task 7): the version rides version.properties at the repo
        // root; CI bumps the minor digit on every asset change (see
        // .github/workflows/android.yml) - 1.7.30 -> 1.7.31. versionCode is
        // the monotonic integer form (1.7.30 -> 10730).
        def vprops = new Properties()
        def vfile = rootProject.file('version.properties')
        if (vfile.exists()) vfile.withInputStream { vprops.load(it) }
        versionCode (vprops.getProperty('versionCode', '10730') as Integer)
        versionName vprops.getProperty('versionName', '1.7.30')
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=none',
                          // 16 KB page-size compatibility (Android 15+)
                          '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    // store native libs uncompressed so AGP can 16 KB-align them in the APK
    packagingOptions {
        jniLibs {
            useLegacyPackaging false
        }
    }

    signingConfigs {
        sh1 {
            def ks = rootProject.file('sh1.keystore')
            if (ks.exists()) {
                storeFile ks
                storePassword 'sh1wall'
                keyAlias 'sh1'
                keyPassword 'sh1wall'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // committed personal keystore if present, else debug-signed
            signingConfig rootProject.file('sh1.keystore').exists()
                    ? signingConfigs.sh1 : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

/* zero dependencies — pure android.framework + one native lib */
